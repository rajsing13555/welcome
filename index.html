<title>Welcome to my world - Mr.vinroger</title>

<style>
:root{box-sizing:border-box;--bg:#0b0b0d;--fg:#fff;--accent:#ff6a00;--muted:#b9b9c0;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--fg:#fff;--accent:#ff6a00;--muted:#b9b9c0}}
:root[data-theme="dark"]{--bg:#0b0b0d;--fg:#fff;--accent:#ff6a00;--muted:#b9b9c0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;
 background:radial-gradient(circle at 50% 30%,#2a1300 0%,var(--bg) 60%)}
.stage{width:100%;max-width:440px;padding:20px;text-align:center}
#start{display:flex;flex-direction:column;align-items:center;gap:22px}
.btn-start{position:relative;width:170px;height:170px;border-radius:50%;border:3px solid var(--accent);
 background:#1a0c00;color:var(--accent);font-weight:800;font-size:18px;letter-spacing:1px;cursor:pointer;
 box-shadow:0 0 30px rgba(255,106,0,.45);animation:pulse 1.6s infinite}
.btn-start span{display:block;font-size:34px;margin-bottom:6px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,106,0,.6)}70%{box-shadow:0 0 0 30px rgba(255,106,0,0)}100%{box-shadow:0 0 0 0 rgba(255,106,0,0)}}
.hint{color:var(--muted);font-size:14px}
#show{display:none}
.card{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--accent);
 box-shadow:0 10px 50px rgba(255,106,0,.35);transform:scale(.2);opacity:0}
.card img{display:block;width:100%;height:auto}
.card.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{to{transform:scale(1);opacity:1}}
.welcome{margin:22px 0 4px;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);opacity:0;transform:translateY(14px)}
.name{margin:0;font-size:38px;font-weight:900;color:var(--accent);opacity:0;transform:translateY(14px);text-shadow:0 0 20px rgba(255,106,0,.5)}
.links{display:flex;flex-direction:column;gap:12px;margin-top:22px;opacity:0;transform:translateY(14px)}
.show{opacity:1!important;transform:none!important;transition:all .6s ease}
.links a{display:block;padding:14px;border-radius:14px;text-decoration:none;font-weight:700;color:#fff;font-size:16px}
.ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}
.yt{background:#e00000}
.replay{margin-top:16px;background:none;border:1px solid #444;color:var(--muted);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer}
.shake{animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(1px,1px)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}100%{transform:translate(1px,2px)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.eq{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:120px}
.eq i{display:block;width:14px;background:var(--accent);border-radius:6px;animation:eq 0.9s ease-in-out infinite;box-shadow:0 0 14px rgba(255,106,0,.6)}
.eq i:nth-child(2){animation-delay:.12s}.eq i:nth-child(3){animation-delay:.24s}.eq i:nth-child(4){animation-delay:.36s}
.eq i:nth-child(5){animation-delay:.18s}.eq i:nth-child(6){animation-delay:.3s}.eq i:nth-child(7){animation-delay:.06s}
@keyframes eq{0%,100%{height:14px}50%{height:110px}}
</style>
</head>

var AC=window.AudioContext||window.webkitAudioContext;
var ctx=null, decoded=null, srcNode=null, H=null;
var timers=[], done=false, started=false;
function $(id){return document.getElementById(id);}
function clearT(){timers.forEach(clearTimeout);timers=[];}
function later(fn,ms){timers.push(setTimeout(fn,ms));}
function toBuf(b64){var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
function finish(){
  if(done) return; done=true; clearT();
  try{ if(srcNode){srcNode.onended=null;srcNode.stop();} }catch(e){}
  try{ if(H){H.pause();} }catch(e){}
  try{ $('fbA').pause(); }catch(e){}
  $('playing').style.display='none'; $('show').style.display='block';
  $('flash').classList.add('go'); $('card').classList.add('pop');
  later(function(){$('w').classList.add('show');},700);
  later(function(){$('n').classList.add('show');},1200);
  later(function(){$('l').classList.add('show');},1800);
}
function showFallback(){
  var a=$('fbA'); a.src='data:audio/mpeg;base64,'+AUD;
  $('fb').style.display='block';
  a.addEventListener('ended',finish);
  a.play().catch(function(){});
  later(finish,20000);
}
function viaHtmlAudio(){
  try{
    H=new Audio('data:audio/mpeg;base64,'+AUD);
    H.addEventListener('ended',finish);
    var p=H.play();
    if(p&&p.then){ p.then(function(){started=true;}).catch(showFallback); }
    else started=true;
  }catch(e){ showFallback(); }
}
function playAudio(){
  if(!AC){ viaHtmlAudio(); return; }
  try{
    if(!ctx) ctx=new AC();
    if(ctx.resume) ctx.resume();
    // unlock (iOS)
    var u=ctx.createBuffer(1,1,22050), us=ctx.createBufferSource(); us.buffer=u; us.connect(ctx.destination); us.start(0);
    var go=function(buf){
      decoded=buf;
      srcNode=ctx.createBufferSource(); srcNode.buffer=buf;
      var g=ctx.createGain(); g.gain.value=1.0;
      srcNode.connect(g); g.connect(ctx.destination);
      srcNode.onended=finish; srcNode.start(0); started=true;
    };
    if(decoded){ go(decoded); return; }
    var ab=toBuf(AUD), ok=false;
    var p=ctx.decodeAudioData(ab,function(b){ if(!ok){ok=true;go(b);} },function(){ if(!ok){ok=true;viaHtmlAudio();} });
    if(p&&p.catch) p.catch(function(){ if(!ok){ok=true;viaHtmlAudio();} });
  }catch(e){ viaHtmlAudio(); }
}
function run(){
  clearT(); done=false; started=false;
  $('start').style.display='none'; $('show').style.display='none'; $('playing').style.display='block'; $('fb').style.display='none';
  $('card').classList.remove('pop'); $('flash').classList.remove('go');
  ['w','n','l'].forEach(function(i){$(i).classList.remove('show');});
  try{ if(navigator.vibrate) navigator.vibrate([60,40,120]); }catch(e){}
  playAudio();
  later(function(){ if(!started && !done) showFallback(); },2500);
  later(function(){ if(!$('fb').style.display||$('fb').style.display==='none') finish(); },16000);
}
$('go').addEventListener('click',run);
$('again').addEventListener('click',run);
$('skip').addEventListener('click',finish);
